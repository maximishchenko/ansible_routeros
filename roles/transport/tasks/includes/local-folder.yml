---
- name: Check if local folder storage exists
  ansible.builtin.file:
    path: "{{ transport_folder.path }}/{{ transport_type }}/{{ group_names[0] }}"
    state: directory
    mode: '0755'
  delegate_to: localhost

- name: Copy file to local folder storage
  delegate_to: localhost
  ansible.builtin.copy:
    src: "{{ transport_src }}"
    dest: "{{ transport_folder.path }}/{{ transport_type }}/{{ group_names[0] }}/{{ transport_src | basename }}"
    mode: '0755'
