---
- name: Backup RouterOS Configuration
  hosts: all
  gather_facts: false
  tasks:
    - name: Upgrade
      include_role:
        name: upgrade
      vars:
        upgrade_type: "{{ type }}"
    - name: Report
      run_once: true
      include_role:
        name: report
      vars:
        report_html_message_text: "{{ upgrade_release_notes_message }}"
        report_type: "Upgrade Release Notes"
        report_caption: "There is a new RouterOS release: {{ upgrade_item_title }}"
      loop: "{{ groups.keys() | reject('in', ['all', 'ungrouped']) | list }}"
      when:
        - type == "check_last_release"
        - upgrade_item_changed | bool
        - (groups[item] | length) > 0
